<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#10151d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cover Dash">
<title>Cover Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap">
<style>
  /* Layout: one full-screen portrait canvas (360x640 logical), letterboxed and centered. Single dark look by design. */
  :root {
    --ground: #1c2431;
    --ground-line: #263042;
    --concrete: #9aa3b2;
    --player: #f2c14e;
    --enemy: #ff5a4f;
    --ink: #eef1f6;
    --font-display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
    color-scheme: dark;
  }
  html { height: 100%; box-sizing: border-box; background: #10151d; }
  body { height: 100%; margin: 0; background: #10151d; color: var(--ink); overflow: hidden; }
  #stage { height: 100%; display: grid; place-items: center; }
  canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; cursor: pointer; border-radius: 6px; }
  canvas:focus-visible { outline: 2px solid var(--player); outline-offset: 2px; }
</style>

</head><body>
<div id="stage"><canvas id="game" tabindex="0" aria-label="Cover Dash game"></canvas></div>
<script>
(() => {
  // ---------- Tunables (easy to tweak) ----------
  const W = 360, H = 640;               // logical screen size
  const LANES = [78, 180, 282];         // x positions cover can sit at
  const GAP = 150;                      // vertical distance between cover rows
  const MOVE_SPEED = 430;               // how fast the player runs, pixels per second
  const SNAP = 30;                      // taps this close to cover snap you against it
  const ARMOR_MAX = 2;                  // armor stacks
  const THICK = [0.7, 1.3];             // cover size varies by about 30% either way
  const FLAT_HP = 3, TRI_HP = 4;        // hits a cover takes before it breaks
  const SHAPE_HP = { flat: FLAT_HP, tri: TRI_HP, circle: 4, semi: 3 };
  const SIZE = [0.75, 1.25];            // rectangle length and width vary by 25% either way
  const SHAPE_MIX = [['flat', 0.5], ['circle', 0.2], ['semi', 0.15], ['tri', 0.15]]; // how often each cover shape appears
  const PLAYER_R = 11, BULLET_R = 4;
  const HIT_R = PLAYER_R * 0.8;          // fairness: the player's hitbox is a bit smaller than the drawn circle
  const TURRET_Y = 58;                  // turret row, in screen pixels from the top
  const PLAYER_SCREEN_Y = 450;          // where the camera keeps the player
  const FLANK_START = 3;                // score when side attackers begin
  const JAM_TIME = 6, GUARD_TIME = 10;  // power-up durations in seconds
  const GATE_CHANCE = 0.01;             // chance any row of cover comes with an acceleration gate (1%)
  const GATE_HALF = 30;                 // half the width of a gate's opening
  const BOOST_POINTS = 10;              // a gate boosts you for this many points of cover
  const BOOST_SPEED = 2;                // run speed multiplier while boosted
  const BOOST_BLINKS = 3, BLINK_TIME = 0.4; // warning blinks (still safe) before you can be hit again
  const POWER_CHANCE = 0.025;          // chance any cover is a marked power-up cover
  const PICKUP_LIFE = 9;                // seconds a dropped power-up stays before fading
  // Attack speed (how often enemies fire). 1 = starting pace.
  const FULL_BONUS_AT = 100;            // a new player's turrets reach +100% fire rate (+10% move speed) at 100 points
  const BONUS_PAST_BEST = 10;           // after that, the +100% point sits 10 past your best score (normal mode only)
  const BASE_PERIOD = 2.6;              // average seconds between shots per top gun at 1x
  const MIN_AIM = 0.42, MIN_LOCK = 0.32; // fairness: warnings never get shorter than this (0.74s total)
  const BURST_GAP = 0.13;               // seconds between shots when a gun fires a quick burst
  const MAX_FLANKERS = 4;               // most side attackers on screen at once
  const FLANK_EVERY = 40;               // one more side attacker allowed every 40 points
  const FLANK_GAP = 0.9;                // side attackers never fire within this many seconds of each other
  const REVIVE_CUT = 0.78;              // reviving cuts attack speed by 22%
  const AD_SECONDS = 5;                 // length of the simulated ad
  const DRIFT_START = 20;               // score when the top guns start drifting side to side
  const DRIFT_SPEED = 28, DRIFT_RANGE = 42; // base drift speed (px/s) and how far each gun wanders from its spot
  const SHOW_ATTACK = false;            // tuning readout of attack speed in the corner
  const LEAD_START = 10, LEAD_FULL = 120; // top guns start leading your movement at 10 points, fully at 120
  const LEAD_BULLET_GAIN = 160;         // extra bullet speed as their aim improves
  const BULLET_SPEED = 520, BULLET_SPEED_GAIN = 240, SIDE_BULLET_SPEED = 500;
  const POWER = {
    jam:   { color: '#5fb4ff', label: 'JAM',   hud: 'TOP GUNS JAMMED', desc: 'Stops the top guns for 6s' },
    guard: { color: '#6ee7a0', label: 'GUARD', hud: 'AUTO-GUARD', desc: 'Shoots side attackers for 10s' },
    armor: { color: '#c9a7ff', label: 'ARMOR', hud: 'ARMOR', desc: 'Blocks 1 shot · hold up to 2' },
  };

  const css = getComputedStyle(document.documentElement);
  const C = {
    ground: css.getPropertyValue('--ground').trim(),
    line: css.getPropertyValue('--ground-line').trim(),
    concrete: css.getPropertyValue('--concrete').trim(),
    player: css.getPropertyValue('--player').trim(),
    enemy: css.getPropertyValue('--enemy').trim(),
    ink: css.getPropertyValue('--ink').trim(),
  };
  const FONT = css.getPropertyValue('--font-display').trim();

  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');
  const stage = document.getElementById('stage');

  function resize() {
    const s = Math.min(stage.clientWidth / W, stage.clientHeight / H);
    const dpr = window.devicePixelRatio || 1;
    cvs.style.width = W * s + 'px';
    cvs.style.height = H * s + 'px';
    cvs.width = Math.round(W * s * dpr);
    cvs.height = Math.round(H * s * dpr);
    ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  // ---------- Helpers ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  // Layout randomness. Normal runs use Math.random. The daily Pure Skill run seeds each row from
  // the UTC date, so everyone gets the same course that day (shot-away cover still respawns randomly).
  let lrng = Math.random;
  const lrand = (a, b) => a + lrng() * (b - a);
  const lrandInt = (a, b) => Math.floor(lrand(a, b + 1));
  const utcDay = () => new Date().toISOString().slice(0, 10);
  function hashStr(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  let daySeed = 0;
  const seeded = salt => runMode === 'pure' ? mulberry32(hashStr(daySeed + ':' + salt)) : Math.random;
  const lerp = (a, b, k) => a + (b - a) * k;
  const ease = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  // High score, plus the attack speed you were facing when you set it
  let best = 0, bestRate = 1;
  try { best = +localStorage.getItem('coverdash-best') || 0; bestRate = +localStorage.getItem('coverdash-best-rate') || 1; } catch (e) {}

      if (noAds) { toast = 'Ads already removed'; toastT = 2; return; }
      purchase('noads'); return;
    }
    if (id === 'tokens') { purchase('tokens'); return; }
    if (id === 'adtoken') {
      if (adTokensLeft() <= 0) { toast = 'No more free tokens today'; toastT = 2; return; }
      if (noAds) {   // Remove Ads owners claim their 3 daily tokens without watching anything
        if (adTokenDay !== today()) { adTokenDay = today(); adTokensToday = 0; }
        adTokensToday += 1; tokens += 1; saveTokens();
        toast = 'Got 1 continue token'; toastT = 2; return;
      }
      startAd('token'); return;
    }
    purchase(id);   // pack, jam, guard, armor
  }

  function activate(p) {
    p.used = true;
    burst(p.x, p.y, POWER[p.type].color, 24, 220);
    sfx('power'); vibrate(25);
    if (p.type === 'jam') {
      jam = JAM_TIME;
      for (const t of turrets) { t.phase = 'idle'; t.timer = 0.5; }
      bullets = bullets.filter(b => b.friendly || b.side);   // shots already in the air from the top fizzle out
    } else if (p.type === 'guard') {
      guard = GUARD_TIME; guardCd = 0.2;
    } else {
      armor = Math.min(ARMOR_MAX, armor + 1);
    }
  }

  // size > 4 makes chunky debris that lingers longer
  function burst(x, y, color, n, sp, size) {
    const big = (size || 3.5) > 4;
    for (let k = 0; k < n; k++) {
      const a = rand(0, Math.PI * 2), v = rand(sp * 0.3, sp), life = big ? rand(0.5, 0.9) : rand(0.3, 0.6);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, color, r: rand(1.5, size || 3.5) });
    }
  }

  function hitPlayer() {
    state = 'dying';
    shake = 14; flash = 1; slowMo = 0.5;
    sfx('hurt'); vibrate([60, 40, 140]);
    burst(player.x, player.y, C.player, 26, 260);
    burst(player.x, player.y, C.enemy, 10, 180);
    deathRate = stepRate();   // saved without the revive discount, so ads never make later runs easier
    setTimeout(() => {
      state = 'over';
      overAt = performance.now();
      canRevive = runMode !== 'pure' && ((!adUsed && (noAds || adReady())) || (tokens > 0 && tokensUsed < TOKENS_PER_RUN));
      if (!canRevive) endRun();
    }, 700);
  }

  // The run is really over: record the high score and the attack speed it was set at.
  function endRun() {
    canRevive = false;
    runsPlayed += 1;
    if (runsPlayed % RUNS_PER_TOKEN === 0) { tokens += 1; earnedToken = true; }
    saveTokens();
    overAt = performance.now();
    // Every run counts on Anything Goes. Runs with no stocked items and no continues also count on Pure Skill.
    // Pure Skill runs count on both ladders (they're strictly harder); normal runs count on Anything Goes.
    maybeForcedAd();
    awardRun();
    const pure = runMode === 'pure';
    boardResult = { pure, ranks: Boards.submit(score, pure ? ['pure', 'any'] : ['any']), prevBest: best, prevDaily: pure ? dailyBest() : 0 };
    if (pure && score > dailyBest()) { daily = { day: utcDay(), best: score }; try { localStorage.setItem('coverdash-daily', JSON.stringify(daily)); } catch (e) {} }
    newMedal = MEDALS.filter(m => best < m.score && score >= m.score).pop() || null;
    if (newMedal) { medal = newMedal.id; saveMedal(); }
    if (score > best) {
      newSkins = THEMES.filter(t => t.score && best < t.score && score >= t.score).map(t => t.name);
      best = score; bestRate = deathRate; newBest = true;
      sfx('best');
      try { localStorage.setItem('coverdash-best', best); localStorage.setItem('coverdash-best-rate', bestRate.toFixed(3)); } catch (e) {}
    }
  }

  // Simulated ad finished: back in, same spot, short shield, slower attacks. One revive per run.
  function revive() {
    revived = true; reviveMul = REVIVE_CUT;
    sfx('revive');
    state = 'play'; invuln = 2;
    bullets = []; flankers = []; flankTimer = rand(5, 7);
    player.path = [];
    for (const t of turrets) { t.phase = 'idle'; t.timer = rand(1.2, 2); }
    flash = 0;
  }

  const BTN_AD = { x: 44, y: 352, w: W - 88, h: 46 }, BTN_END = { x: 44, y: 410, w: W - 88, h: 38 };
  const inBtn = (b, x, y) => x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h;

  function fire(ox, oy, tx, ty, speed, extra) {
    const dx = tx - ox, dy = ty - oy, len = Math.hypot(dx, dy) || 1;
    sfx(extra && extra.friendly ? 'drone' : 'shot');
    bullets.push(Object.assign({ x: ox + dx / len * 16, y: oy + dy / len * 16, vx: dx / len * speed, vy: dy / len * speed }, extra));
  }

  // ---------- Update ----------
  function update(dt) {
    toastT = Math.max(0, toastT - dt);
    splashT = Math.max(0, splashT - dt);
    if (hint) { hint.t -= dt; if (hint.t <= 0 || (hint.id === 'move' && score >= 1)) hint = null; }
    scorePop = Math.max(0, (scorePop || 0) - dt * 4);
    bestFlashT = Math.max(0, (bestFlashT || 0) - dt);
    ghostFlashT = Math.max(0, ghostFlashT - dt);
    for (const pp of pops) { pp.t -= dt; pp.y -= 40 * dt; }
    pops = pops.filter(pp => pp.t > 0);
    for (const k in invFlash) invFlash[k] = Math.max(0, invFlash[k] - dt * 1.5);
    // brief slow motion when a tutorial hint pops up, or when you're hit
    if (slowMo > 0) { slowMo -= dt; dt *= 0.4; }
    if (state === 'ad') {
      adLeft -= dt;
      if (adLeft <= 0) grantAd(adPurpose);
      return;
    }
    if (state === 'play' || state === 'dying') {
      const d = difficulty();

      if (state === 'play' && player.path.length) {
        let step = MOVE_SPEED * (boosting() ? BOOST_SPEED : 1) * dt;
        const py0 = player.y;
        while (step > 0 && player.path.length) {
          const p = player.path[0], l = Math.hypot(p[0] - player.x, p[1] - player.y);
          if (l <= step) { player.x = p[0]; player.y = p[1]; player.path.shift(); step -= l; }
          else { player.x += (p[0] - player.x) / l * step; player.y += (p[1] - player.y) / l * step; step = 0; }
        }
        player.trail.push([player.x, player.y]);
        if (player.trail.length > (boosting() ? 14 : 8)) player.trail.shift();
        // Running through a gate's opening (either direction) starts the boost.
        for (const r of [score - 1, score, score + 1, score + 2]) {
          const g = rows[r] && rows[r].gate;
          if (g && !g.used && g.charged && Math.min(py0, player.y) <= g.y && Math.max(py0, player.y) >= g.y && Math.abs(player.x - g.x) < GATE_HALF) {
            g.used = true; boostEnd = score + BOOST_POINTS; boostBlink = 0;
            sfx('gate'); vibrate(30); flash = Math.max(flash, 0.25);
            burst(g.x, g.y, GATE_COLOR, 26, 260);
          }
        }
        // Score is the furthest row of cover you've reached.
        const reached = Math.max(0, Math.floor((-player.y + 30) / GAP));
        if (reached > score) {
          score = reached;
          scorePop = 1;
          if (best > 0 && !passedBest && score > best) { passedBest = true; bestFlashT = 2; sfx('best'); }
          if (runMode === 'pure' && dailyBest() > 0 && !ghostPassed && score > dailyBest()) { ghostPassed = true; ghostFlashT = 2; flash = 0; sfx('gate'); }
          rowAt(score + 7);
          syncTurrets();
          // Boost over: blink a few times (still safe), then you can be hit again.
          if (boostEnd && score >= boostEnd) { boostEnd = 0; boostBlink = BOOST_BLINKS * BLINK_TIME; sfx('unboost'); }
          for (let r = score + 1; r <= score + 4; r++) if (rows[r].gate && !rows[r].gate.used) showHint('gate');
          // A fork is next: send a side attacker so the choice matters.
          if (score >= FLANK_START && rows[score + 1].fork) spawnFlanker();
        }
      } else if (player.trail.length) player.trail.shift();
      rowAt(Math.floor((-camY) / GAP) + 3);
      // Fairness: the next row of cover always exists. If it gets shot away before you reach it, fresh cover drops in.
      for (const r of [score + 1, score + 2]) {
        const row = rowAt(r);
        if (row.covers.every(c => c.hp <= 0)) {
          row.covers = row.covers.map(c => Object.assign(makeCover(c.lane, -r * GAP, c.shape), { row: r }));
          for (const c of row.covers) burst(c.cx, c.cy, C.concrete, 14, 120);
        }
      }

      // Top turrets: idle -> aim (thin laser) -> lock (flashing laser) -> fire
      const speed = BULLET_SPEED + BULLET_SPEED_GAIN * d + LEAD_BULLET_GAIN * accuracy(), A = attackRate();
      for (const t of turrets) {
        const ox = t.sx, oy = camY + TURRET_Y + 14;
        t.recoil = Math.max(0, t.recoil - dt * 6);
        // Drift: +1% move speed for every +10% fire rate
        if (score >= DRIFT_START && jam <= 0) {
          const v = DRIFT_SPEED * (1 + 0.01 * Math.max(0, (A - 1) / 0.1));
          t.off += t.dir * v * dt;
          if (Math.abs(t.off) > DRIFT_RANGE) { t.off = Math.sign(t.off) * DRIFT_RANGE; t.dir *= -1; }
          t.sx = t.home + t.off;
        }
        if (jam > 0) { t.phase = 'idle'; t.timer = Math.max(t.timer, 0.5); continue; }
        t.timer -= dt;
        if (state === 'play') { const a = aimPoint(ox, oy, speed, turrets.indexOf(t)); t.tx = a.x; t.ty = a.y; }
        if (t.timer > 0) continue;
        if (t.phase === 'idle') {
          // Plan one attack so this gun averages one shot every BASE_PERIOD / A seconds.
          // The warning (aim + lock) can't shrink forever, so at high rates the gun fires a quick burst instead.
          const aim = Math.max(MIN_AIM, 0.8 / Math.sqrt(A)), lock = Math.max(MIN_LOCK, 0.36 / Math.pow(A, 0.25));
          const P = BASE_PERIOD / A, warn = aim + lock;
          const k = P >= warn + 0.2 ? 1 : Math.ceil((warn + 0.2) / P);
          t.phase = 'aim'; t.timer = aim; t.lockT = lock; t.k = k;
          t.rest = Math.max(0.15, k * P - warn - (k - 1) * BURST_GAP);
        }
        else if (t.phase === 'aim') {
          if (flankers.some(f => f.phase === 'lock' && f.timer < 0.2)) { t.timer = 0.1; continue; }   // let the side shot go first
          t.phase = 'lock'; t.timer = t.lockT;
          if (state === 'play') { sfx('lock'); if (score >= 1) showHint('laser', true); }
        }
        else {
          if (state === 'play') { fire(ox, oy, t.tx, t.ty, speed); t.recoil = 1; }
          t.k -= 1;
          if (t.k > 0) { t.phase = 'burst'; t.timer = BURST_GAP; }
          else { t.phase = 'idle'; t.timer = t.rest * rand(0.75, 1.25); }
        }
      }

      // Side attackers: slide in, track you, flash, fire once, leave. More are allowed as score climbs;
      // their speed never changes, and their shots are staggered (see flankMayLock).
      gameT += dt;
      if (state === 'play' && score >= FLANK_START && flankers.length < maxFlankers()) {
        flankTimer -= dt;
        if (flankTimer <= 0) { spawnFlanker(); flankTimer = rand(3, 6) / Math.sqrt(maxFlankers()); }
      }
      for (const f of flankers.slice()) {
        f.recoil = Math.max(0, f.recoil - dt * 6);
        f.y = lerp(f.y, player.y + f.off, Math.min(1, dt * 2.2));
        if (state === 'play' && f.phase !== 'leave') { f.tx = player.x; f.ty = player.y; }
        f.timer -= dt;
        if (f.phase === 'enter') { f.slide = Math.min(1, f.slide + dt / 0.6); if (f.timer <= 0) { f.phase = 'aim'; f.timer = 1.0; } }
        else if (f.phase === 'aim' && f.timer <= 0 && flankMayLock()) { f.phase = 'lock'; f.timer = 0.42; }
        else if (f.phase === 'lock' && f.timer <= 0) {
          if (state === 'play') { fire(flankX(f), f.y, f.tx, f.ty, SIDE_BULLET_SPEED, { side: true }); f.recoil = 1; lastFlankShot = gameT; }
          f.phase = 'leave'; f.timer = 0.4;
        } else if (f.phase === 'leave') {
          f.slide = Math.max(0, f.slide - dt / 0.5);
          if (f.slide <= 0) flankers = flankers.filter(o => o !== f);
        }
      }

      // Power-up timers, the guard drone, and dropped power-ups
      jam = Math.max(0, jam - dt);
      invuln = Math.max(0, invuln - dt);
      if (state === 'play') boostBlink = Math.max(0, boostBlink - dt);
      for (let r = Math.max(0, score - 1); r < Math.min(rows.length, score + 6); r++) if (rows[r].gate) rows[r].gate.chargeT = Math.max(0, rows[r].gate.chargeT - dt);
      guard = Math.max(0, guard - dt);
      drone += dt * 4;
      const prey = flankers.filter(f => f.phase !== 'leave' && f.slide > 0.4)
        .sort((a, b) => (a.phase === 'lock' ? -1 : 0) - (b.phase === 'lock' ? -1 : 0))[0];   // shoot the one about to fire first
      if (guard > 0 && state === 'play' && prey) {
        guardCd -= dt;
        if (guardCd <= 0) {
          // Hitscan laser: hits instantly and never misses
          const dx = player.x + Math.cos(drone) * 20, dy = player.y + Math.sin(drone) * 20;
          beams.push({ x1: dx, y1: dy, x2: flankX(prey), y2: prey.y, t: 0.22 });
          sfx('zap'); killFlanker(prey);
          guardCd = 0.3;
        }
      }
      for (const bm of beams) bm.t -= dt;
      beams = beams.filter(bm => bm.t > 0);
      for (const p of pickups) p.life -= dt;
      pickups = pickups.filter(p => p.life > 0 && !p.used);

      // Bullets (moved in small steps so they can't skip through thin cover)
      for (const b of bullets) {
        const steps = Math.ceil(Math.hypot(b.vx, b.vy) * dt / 6);
        for (let k = 0; k < steps && !b.dead; k++) {
          b.x += b.vx * dt / steps; b.y += b.vy * dt / steps;
          if (b.friendly) {
            const hit = flankers.find(f => Math.hypot(b.x - flankX(f), b.y - f.y) < 16);
            if (hit) { b.dead = true; killFlanker(hit); }
            continue;
          }
          // A turret shot that flies into a gate is soaked up. The first one charges it; after that the
          // field keeps soaking turret shots, so waiting behind a gate for it to charge isn't a death trap.
          if (!b.side) {
            const g = gateNear(b.x, b.y);
            if (g) {
              b.dead = true;
              if (!g.charged) { g.charged = true; g.chargeT = 0.6; sfx('charge'); burst(g.x, g.y, GATE_COLOR, 22, 220); }
              else { sfx('block'); burst(b.x, b.y, GATE_COLOR, 8, 140); }
              break;
            }
          }
          for (const row of rows) {
            for (const s of row.covers) {
              if (s.hp <= 0 || Math.abs(s.cy - b.y) > 70 || !coverHits(s, b.x, b.y)) continue;
              b.dead = true;
              s.hp -= 1; s.hit = 1;
              if (s.hp > 0) sfx('coverHit');
              burst(b.x, b.y, s.hp > 0 ? '#c9d0db' : C.concrete, s.hp > 0 ? 7 : 22, s.hp > 0 ? 120 : 220);
              if (s.hp <= 0) {
                shake = Math.max(shake, 5);
                burst(s.cx, s.cy, C.concrete, 12, 200, 7);   // chunky debris
                sfx('coverBreak'); vibrate(20);
                // Auto-collect: a marked cover's power-up goes straight into your stock, so you never have to stop for it
                // Auto-use: a marked cover's power-up fires the moment the cover breaks (it never goes into stock).
                // If the same power is already running it restarts at full time; armor still caps at 2.
                if (s.power) {
                  activate({ type: s.power, x: s.cx, y: s.cy });
                  pops.push({ x: s.cx, y: s.cy, text: POWER[s.power].label, col: POWER[s.power].color, t: 1.2 });
                  showHint('autouse', true);
                }
              }
              break;
            }
            if (b.dead) break;
          }
          if (!b.dead && state === 'play' && invuln <= 0 && !boosting() && boostBlink <= 0 && Math.hypot(b.x - player.x, b.y - player.y) < HIT_R + BULLET_R + (armor ? 4 : 0)) {
            b.dead = true;
            if (armor > 0) {
              armor -= 1; shake = Math.max(shake, 6);
              sfx('block'); vibrate(40);
              burst(b.x, b.y, POWER.armor.color, 20, 200);
            } else hitPlayer();
          }
        }
        const sy = b.y - camY;
        if (sy > H + 40 || sy < -40 || b.x < -40 || b.x > W + 40) b.dead = true;
      }
      bullets = bullets.filter(b => !b.dead);
      for (const row of rows) for (const s of row.covers) s.hit = Math.max(0, s.hit - dt * 5);
    }

    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);

    if (player) camY = lerp(camY, player.y - PLAYER_SCREEN_Y, Math.min(1, dt * 7));
    shake = Math.max(0, shake - dt * 40);
    flash = Math.max(0, flash - dt * 2.5);
  }

  // ---------- Draw ----------
  function laser(ox, oy, tx, ty, phase, now) {
    const dx = tx - ox, dy = ty - oy, len = Math.hypot(dx, dy) || 1;
    if (phase === 'aim') { ctx.strokeStyle = 'rgba(255,90,79,0.28)'; ctx.lineWidth = 1; }
    else { ctx.strokeStyle = (Math.floor(now / 70) % 2) ? 'rgba(255,90,79,0.95)' : 'rgba(255,170,160,0.95)'; ctx.lineWidth = 2.5; }
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + dx / len * 900, oy + dy / len * 900); ctx.stroke();
  }

  function polyPath(pts, ox, oy) {
    ctx.beginPath();
    pts.forEach((p, k) => k ? ctx.lineTo(p[0] + ox, p[1] + oy) : ctx.moveTo(p[0] + ox, p[1] + oy));
    ctx.closePath();
  }
  function drawCover(c) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    polyPath(c.pts, 3, 5); ctx.fill();
    ctx.fillStyle = c.hit > 0 ? '#e6ebf2' : C.concrete;
    polyPath(c.pts, 0, 0); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1.5;
    polyPath(c.pts, 0, 0); ctx.stroke();
    // cracks from the middle toward the corners as damage builds
    const full = c.maxHp || SHAPE_HP[c.shape] || FLAT_HP;
    const lost = Math.ceil((1 - c.hp / full) * Math.min(full, c.pts.length) - 1e-6);
    const stride = Math.max(1, Math.floor(c.pts.length / Math.min(full, c.pts.length)));
    ctx.strokeStyle = 'rgba(30,36,48,0.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let k = 0; k < lost && k < c.pts.length; k++) {
      const p = c.pts[(k * stride) % c.pts.length];
      ctx.moveTo(c.cx, c.cy);
      ctx.lineTo(lerp(c.cx, p[0], 0.45) + 4, lerp(c.cy, p[1], 0.45) - 2);
      ctx.lineTo(lerp(c.cx, p[0], 0.8), lerp(c.cy, p[1], 0.8));
    }
    ctx.stroke();
    if (c.power) {
      const col = POWER[c.power].color;
      ctx.fillStyle = '#141a24';
      ctx.beginPath(); ctx.arc(c.cx, c.cy, 9, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(c.cx, c.cy, 9, 0, Math.PI * 2); ctx.stroke();
      powerGlyph(c.power, c.cx, c.cy, 5, col);
    }
  }

  // Jam = a lightning bolt, Guard = a crosshair
  function powerGlyph(type, x, y, s, col) {
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2;
    ctx.beginPath();
    if (type === 'jam') {
      ctx.moveTo(x + s * 0.3, y - s); ctx.lineTo(x - s * 0.5, y + s * 0.1); ctx.lineTo(x + s * 0.2, y + s * 0.1); ctx.lineTo(x - s * 0.3, y + s);
      ctx.stroke();
    } else if (type === 'armor') {
      ctx.moveTo(x - s * 0.8, y - s * 0.7); ctx.lineTo(x + s * 0.8, y - s * 0.7); ctx.lineTo(x + s * 0.7, y + s * 0.1);
      ctx.lineTo(x, y + s); ctx.lineTo(x - s * 0.7, y + s * 0.1); ctx.closePath();
      ctx.stroke();
    } else {
      ctx.arc(x, y, s * 0.6, 0, Math.PI * 2);
      ctx.moveTo(x - s, y); ctx.lineTo(x + s, y); ctx.moveTo(x, y - s); ctx.lineTo(x, y + s);
      ctx.stroke();
    }
  }

  function draw(now) {
    uiHits = [];
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);

    // Ground with scrolling grid
    ctx.fillStyle = C.ground;
    ctx.fillRect(-20, -20, W + 40, H + 40);
    const cy = camY || 0;
    ctx.strokeStyle = C.line; ctx.lineWidth = 1;
    const off = ((-cy % 50) + 50) % 50;
    ctx.beginPath();
    for (let y = off; y < H; y += 50) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    for (let x = 30; x < W; x += 50) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    ctx.stroke();

    if (state === 'title') { drawTitle(now); drawSplash(); ctx.restore(); return; }
    if (state === 'store') { drawStore(); ctx.restore(); return; }
    if (state === 'skins') { drawSkins(); ctx.restore(); return; }
    if (state === 'settings') { drawSettings(); ctx.restore(); return; }
    if (state === 'boards') { drawBoards(); ctx.restore(); return; }
    if (state === 'pure') { drawPure(); ctx.restore(); return; }

    ctx.save();
    ctx.translate(0, -camY);

    // Cover
    for (const row of rows) for (const s of row.covers) {
      if (s.hp <= 0 || s.cy - camY > H + 80 || s.cy - camY < -60) continue;
      drawCover(s);
    }
    // Acceleration gates: two metal pylons with an energy field between them, always facing forward.
    // Uncharged: dark and dashed. Charged (a turret shot hit it): bright, glowing, arrows racing forward.
    for (const row of rows) {
      const g = row.gate;
      if (!g || g.y - camY > H + 40 || g.y - camY < -40) continue;
      const sh = 0.5 + 0.5 * Math.sin(now / 120), on = g.charged && !g.used;
      ctx.globalAlpha = g.used ? 0.3 : 1;
      if (on) {
        ctx.save(); ctx.shadowColor = GATE_COLOR; ctx.shadowBlur = 18 + 8 * sh;
        ctx.fillStyle = `rgba(79,216,255,${0.28 + 0.15 * sh})`;
        ctx.fillRect(g.x - GATE_HALF, g.y - 9, GATE_HALF * 2, 18);
        ctx.restore();
        ctx.strokeStyle = '#eafcff'; ctx.lineWidth = 2.5;
        for (let k = 0; k < 3; k++) {
          const cy = g.y + 7 - k * 7 - ((now / 45) % 7);
          ctx.beginPath(); ctx.moveTo(g.x - 10, cy + 4); ctx.lineTo(g.x, cy - 3); ctx.lineTo(g.x + 10, cy + 4); ctx.stroke();
        }
      } else if (!g.used) {
        ctx.strokeStyle = 'rgba(79,216,255,0.45)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
        ctx.strokeRect(g.x - GATE_HALF, g.y - 9, GATE_HALF * 2, 18); ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(79,216,255,0.7)'; ctx.font = `700 9px ${FONT}`; ctx.textAlign = 'center';
        ctx.fillText('NEEDS A SHOT', g.x, g.y + 27);
      }
      for (const sx of [-1, 1]) {   // pylons
        const px = g.x + sx * (GATE_HALF + 4);
        ctx.fillStyle = '#2b3442'; ctx.fillRect(px - 5, g.y - 15, 10, 30);
        ctx.strokeStyle = GATE_COLOR; ctx.lineWidth = 1.5; ctx.strokeRect(px - 5, g.y - 15, 10, 30);
        ctx.fillStyle = on ? '#eafcff' : 'rgba(79,216,255,' + (0.25 + 0.2 * sh) + ')';
        ctx.beginPath(); ctx.arc(px, g.y - 15, 4, 0, Math.PI * 2); ctx.fill();
      }
      if (g.chargeT > 0) {   // flash ring when it gets charged
        ctx.strokeStyle = GATE_COLOR; ctx.lineWidth = 3; ctx.globalAlpha = g.chargeT / 0.6;
        ctx.beginPath(); ctx.arc(g.x, g.y, GATE_HALF + 30 * (1 - g.chargeT / 0.6), 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    // "+1 JAM" pops where a marked cover breaks
    for (const pp of pops) {
      ctx.globalAlpha = Math.min(1, pp.t * 1.5); ctx.fillStyle = pp.col; ctx.font = `700 15px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillText(pp.text, pp.x, pp.y); ctx.globalAlpha = 1;
    }
    // Ghost line: where your best daily Pure Skill run ended today
    if (runMode === 'pure' && dailyBest() > 0 && (state === 'play' || state === 'paused' || state === 'dying')) {
      const gy = -dailyBest() * GAP + 30;
      if (gy - camY > -20 && gy - camY < H + 20) {
        const a = ghostPassed ? 0.25 : 0.75;
        ctx.strokeStyle = `rgba(190,160,255,${a})`; ctx.lineWidth = 2; ctx.setLineDash([10, 6]);
        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = `rgba(190,160,255,${a})`; ctx.font = `700 11px ${FONT}`; ctx.textAlign = 'left';
        ctx.fillText(`TODAY'S BEST ${dailyBest()}`, 8, gy - 6);
      }
    }
    // Next cover to score: soft glow around it, and a glowing line you must cross to bank the point
    if (state === 'play' || state === 'paused') {
      const n = score + 1, lineY = -n * GAP + 30, pulse = 0.5 + 0.5 * Math.sin(now / 220);
      const g = ctx.createLinearGradient(0, lineY - 26, 0, lineY + 4);
      g.addColorStop(0, 'rgba(242,193,78,0)'); g.addColorStop(1, `rgba(242,193,78,${0.10 + 0.08 * pulse})`);
      ctx.fillStyle = g; ctx.fillRect(0, lineY - 26, W, 30);
      ctx.strokeStyle = `rgba(242,193,78,${0.35 + 0.3 * pulse})`; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
      ctx.beginPath(); ctx.moveTo(0, lineY); ctx.lineTo(W, lineY); ctx.stroke(); ctx.setLineDash([]);
      ctx.save(); ctx.shadowColor = C.player; ctx.shadowBlur = 14 + 8 * pulse;
      ctx.strokeStyle = `rgba(242,193,78,${0.5 + 0.3 * pulse})`; ctx.lineWidth = 2;
      for (const c of rowAt(n).covers) if (c.hp > 0) { polyPath(c.pts, 0, 0); ctx.stroke(); }
      ctx.restore();
      ctx.fillStyle = `rgba(242,193,78,${0.55 + 0.3 * pulse})`; ctx.font = `700 10px ${FONT}`; ctx.textAlign = 'right';
      ctx.fillText('+1', W - 8, lineY - 6);
    }

    // Route you're running and where it ends
    if (state === 'play' && player.path.length) {
      ctx.strokeStyle = 'rgba(242,193,78,0.45)'; ctx.lineWidth = 2; ctx.setLineDash([3, 6]);
      ctx.beginPath(); ctx.moveTo(player.x, player.y);
      for (const p of player.path) ctx.lineTo(p[0], p[1]);
      ctx.stroke(); ctx.setLineDash([]);
      const end = player.path[player.path.length - 1];
      ctx.beginPath(); ctx.arc(end[0], end[1], PLAYER_R + 4, 0, Math.PI * 2); ctx.stroke();
    }

    // Player
    const blinkOff = boostBlink > 0 && (boostBlink % BLINK_TIME) < BLINK_TIME / 2;
    if (state !== 'over' && state !== 'dying' && state !== 'ad' && !(invuln > 0 && Math.floor(now / 90) % 2)) {
      if (boosting() || boostBlink > 0) {   // boost shield: solid while boosted, blinks 3 times before it ends
        ctx.globalAlpha = blinkOff ? 0.12 : 0.55 + 0.2 * Math.sin(now / 80);
        ctx.strokeStyle = GATE_COLOR; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(player.x, player.y, PLAYER_R + 7, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = 'rgba(79,216,255,0.15)'; ctx.fill();
        ctx.globalAlpha = 1;
      }
      if (player.trail.length > 1) {
        ctx.strokeStyle = boosting() ? 'rgba(79,216,255,0.4)' : 'rgba(242,193,78,0.3)'; ctx.lineWidth = PLAYER_R; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath(); player.trail.forEach((p, k) => k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
        ctx.lineCap = 'butt';
      }
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.ellipse(player.x + 2, player.y + 9, PLAYER_R, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.player;
      ctx.beginPath(); ctx.arc(player.x, player.y, PLAYER_R, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7a5a12';
      if (MEDALS.some(m => m.id === medal && medalEarned(m))) drawMedal(medal, player.x, player.y, 7.5);
      else { ctx.beginPath(); ctx.arc(player.x, player.y - 3, 4, 0, Math.PI * 2); ctx.fill(); }
      // one ring per armor stack
      ctx.strokeStyle = POWER.armor.color; ctx.lineWidth = 2.5;
      for (let k = 0; k < armor; k++) { ctx.beginPath(); ctx.arc(player.x, player.y, PLAYER_R + 4 + k * 5, 0, Math.PI * 2); ctx.stroke(); }
    }

    // Guard laser beams
    for (const bm of beams) {
      const k = bm.t / 0.22;
      ctx.save(); ctx.shadowColor = POWER.guard.color; ctx.shadowBlur = 12;
      ctx.strokeStyle = `rgba(110,231,160,${k})`; ctx.lineWidth = 2 + 4 * k;
      ctx.beginPath(); ctx.moveTo(bm.x1, bm.y1); ctx.lineTo(bm.x2, bm.y2); ctx.stroke();
      ctx.strokeStyle = `rgba(230,255,240,${k})`; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(bm.x1, bm.y1); ctx.lineTo(bm.x2, bm.y2); ctx.stroke();
      ctx.restore();
    }
    // Guard drone
    if (guard > 0 && state === 'play') {
      const dx = player.x + Math.cos(drone) * 20, dy = player.y + Math.sin(drone) * 20;
      ctx.fillStyle = POWER.guard.color;
      ctx.beginPath(); ctx.arc(dx, dy, 4.5, 0, Math.PI * 2); ctx.fill();
    }

    // Dropped power-ups
    for (const p of pickups) {
      if (p.life < 2.5 && Math.floor(now / 100) % 2) continue;   // blink before fading
      const col = POWER[p.type].color, pulse = 0.5 + 0.5 * Math.sin(now / 140);
      ctx.globalAlpha = 0.25 + 0.2 * pulse;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(p.x, p.y, 22 + pulse * 4, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#141a24';
      ctx.beginPath(); ctx.arc(p.x, p.y, 15, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, 15, 0, Math.PI * 2); ctx.stroke();
      powerGlyph(p.type, p.x, p.y, 8, col);
      ctx.fillStyle = col; ctx.textAlign = 'center';
      ctx.font = `700 11px ${FONT}`;
      ctx.fillText('TAP · ' + POWER[p.type].label, p.x, p.y - 26);
    }

    // Lasers
    if (state === 'play') {
      for (const t of turrets) if (t.phase !== 'idle') laser(t.sx, camY + TURRET_Y + 14, t.tx, t.ty, t.phase, now);
      for (const f of flankers) if (f.phase === 'aim' || f.phase === 'lock') laser(flankX(f), f.y, f.tx, f.ty, f.phase, now);
    }

    // Side attacker
    for (const f of flankers) {
      const fx = flankX(f);
      const ang = Math.atan2(f.ty - f.y, f.tx - fx);
      ctx.save(); ctx.translate(fx, f.y);
      ctx.save(); ctx.rotate(ang);
      ctx.fillStyle = '#5a1f1c'; ctx.fillRect(4 - f.recoil * 5, -4, 20, 8);
      if (f.recoil > 0.5) { ctx.fillStyle = `rgba(255,214,122,${f.recoil})`; ctx.beginPath(); ctx.arc(26 - f.recoil * 5, 0, 7 * f.recoil, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
      ctx.fillStyle = f.phase === 'lock' ? '#ff8a80' : C.enemy;
      ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(12, 0); ctx.lineTo(0, 14); ctx.lineTo(-12, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#141a24';
      ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // Bullets
    for (const b of bullets) {
      const len = Math.hypot(b.vx, b.vy);
      ctx.strokeStyle = b.friendly ? 'rgba(110,231,160,0.5)' : 'rgba(255,90,79,0.45)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx / len * 18, b.y - b.vy / len * 18); ctx.stroke();
      ctx.fillStyle = b.friendly ? '#d4ffe4' : '#ffd2cc';
      ctx.beginPath(); ctx.arc(b.x, b.y, BULLET_R, 0, Math.PI * 2); ctx.fill();
    }

    // Particles
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // Side attack warning
    for (const f of flankers) {
      if (f.phase !== 'enter' || state !== 'play' || !(Math.floor(now / 120) % 2)) continue;
      const wx = f.side < 0 ? 22 : W - 22, wy = Math.max(TURRET_Y + 50, Math.min(H - 140, f.y - camY));
      ctx.fillStyle = C.enemy;
      ctx.font = `700 30px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillText('!', wx, wy - 22);
    }

    // Enemy line (fixed at top of screen)
    ctx.fillStyle = '#141a24';
    ctx.fillRect(0, 0, W, TURRET_Y + 26);
    ctx.fillStyle = 'rgba(255,90,79,0.5)';
    for (let x = -20; x < W; x += 24) { ctx.beginPath(); ctx.moveTo(x, TURRET_Y + 22); ctx.lineTo(x + 12, TURRET_Y + 22); ctx.lineTo(x + 18, TURRET_Y + 26); ctx.lineTo(x + 6, TURRET_Y + 26); ctx.fill(); }
    for (const t of turrets) {
      const ox = t.sx, oy = TURRET_Y;
      const ang = Math.atan2(t.ty - (camY + oy + 14), t.tx - ox);
      ctx.save(); ctx.translate(ox, oy + 6);
      ctx.save(); ctx.rotate(ang);
      ctx.fillStyle = '#5a1f1c';
      ctx.fillRect(4 - t.recoil * 5, -4, 20, 8);
      if (t.recoil > 0.5) { ctx.fillStyle = `rgba(255,214,122,${t.recoil})`; ctx.beginPath(); ctx.arc(26 - t.recoil * 5, 0, 7 * t.recoil, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
      ctx.fillStyle = jam > 0 ? '#4a5568' : t.phase === 'lock' ? '#ff8a80' : C.enemy;
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#141a24';
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
      if (jam > 0 && Math.floor(now / 90 + t.sx) % 3 === 0) {
        ctx.strokeStyle = POWER.jam.color; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-14, -6); ctx.lineTo(-4, 2); ctx.lineTo(2, -4); ctx.lineTo(14, 6); ctx.stroke();
      }
      ctx.restore();
    }

    // HUD (on a soft band so it reads over cover blocks)
    const g = ctx.createLinearGradient(0, H - 120, 0, H);
    g.addColorStop(0, 'rgba(20,26,36,0)');
    g.addColorStop(0.5, 'rgba(20,26,36,0.85)');
    g.addColorStop(1, 'rgba(20,26,36,0.95)');
    ctx.fillStyle = g; ctx.fillRect(0, H - 120, W, 120);
    ctx.textAlign = 'center';
    ctx.fillStyle = C.ink;
    ctx.font = `700 ${Math.round(44 * (1 + 0.25 * scorePop))}px ${FONT}`;
    ctx.fillText(score, W / 2, H - 52);
    if (ghostFlashT > 0) {
      ctx.globalAlpha = Math.min(1, ghostFlashT); ctx.fillStyle = 'rgba(190,160,255,0.18)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#d2bfff'; ctx.font = `700 18px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillText("PASSED TODAY'S BEST!", W / 2, H - 124); ctx.globalAlpha = 1;
    }
    if (bestFlashT > 0) { ctx.fillStyle = C.player; ctx.font = `700 16px ${FONT}`; ctx.globalAlpha = Math.min(1, bestFlashT); ctx.fillText('NEW BEST!', W / 2, H - 100); ctx.globalAlpha = 1; }
    ctx.font = `600 13px ${FONT}`;
    ctx.fillStyle = 'rgba(238,241,246,0.55)';
    ctx.fillText(`COVER REACHED  ·  BEST ${best}`, W / 2, H - 28);
    if (SHOW_ATTACK) {
      ctx.textAlign = 'right'; ctx.font = `600 11px ${FONT}`; ctx.fillStyle = 'rgba(255,90,79,0.75)';
      ctx.fillText(`ATTACK x${attackRate().toFixed(2)}`, W - 12, H - 12);
    }
    if (runMode !== 'pure') drawInventory();
    ctx.textAlign = 'center';
    // Active power-ups, shown just under the turret row
    let hy = TURRET_Y + 44;
    for (const [type, left, total] of [['jam', jam, JAM_TIME], ['guard', guard, GUARD_TIME]]) {
      if (left <= 0 || state !== 'play') continue;
      const col = POWER[type].color;
      ctx.fillStyle = 'rgba(20,26,36,0.8)'; ctx.fillRect(W / 2 - 90, hy - 12, 180, 22);
      ctx.fillStyle = col; ctx.globalAlpha = 0.35; ctx.fillRect(W / 2 - 90, hy - 12, 180 * left / total, 22); ctx.globalAlpha = 1;
      ctx.fillStyle = col; ctx.font = `700 12px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillText(`${POWER[type].hud}  ${Math.ceil(left)}s`, W / 2, hy + 3);
      hy += 26;
    }

    if ((boosting() || boostBlink > 0) && state === 'play') {
      ctx.fillStyle = 'rgba(20,26,36,0.8)'; ctx.fillRect(W / 2 - 90, hy - 12, 180, 22);
      ctx.fillStyle = GATE_COLOR; ctx.font = `700 12px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillText(boosting() ? `BOOST  ${boostEnd - score} cover left` : 'BOOST ENDING', W / 2, hy + 3);
      hy += 26;
    }
    if (armor > 0 && state === 'play') {
      ctx.fillStyle = POWER.armor.color; ctx.font = `700 12px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillText(`ARMOR ${'■ '.repeat(armor)}${'□ '.repeat(ARMOR_MAX - armor)}`.trim(), W / 2, hy + 3);
    }

    if (state === 'play') {
      // pause button
      uiBtn(W - 48, H - 62, 36, 36, '', () => { state = 'paused'; }, 'ghost');
      ctx.fillStyle = C.ink; ctx.fillRect(W - 36, H - 53, 4, 18); ctx.fillRect(W - 28, H - 53, 4, 18);
      if (hint) drawHint();
      // let players spot marked cover the first time it's on screen
      if (!seenHints.marked && rows.some(r => r.covers.some(c => c.power && c.hp > 0 && c.cy - camY > 120 && c.cy - camY < H - 140))) showHint('marked', true);
    }
    if (state === 'paused') drawPause();
    if (state === 'over') drawOver(now);
    if (state === 'ad') drawAd();
    if (state === 'share') drawShare();

    if (flash > 0) { ctx.fillStyle = `rgba(255,90,79,${flash * 0.35})`; ctx.fillRect(-20, -20, W + 40, H + 40); }
    ctx.restore();
  }

  function panel(y, h) {
    ctx.fillStyle = 'rgba(16,21,29,0.86)';
    ctx.fillRect(24, y, W - 48, h);
    ctx.strokeStyle = 'rgba(242,193,78,0.5)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(24.5, y + 0.5, W - 49, h - 1);
  }

  function drawSplash() {
    if (splashT <= 0) return;
    const a = Math.min(1, splashT / 0.4);   // fades out over the last 0.4s
    ctx.globalAlpha = a;
    ctx.fillStyle = '#1C2333'; ctx.fillRect(-20, -20, W + 40, H + 40);
    const t = SPLASH_TIME - splashT, inA = Math.min(1, t / 0.35);   // and in over the first 0.35s
    if (LOGO_SQUARE.complete) { ctx.globalAlpha = a * inA; ctx.drawImage(LOGO_SQUARE, W / 2 - 120, H / 2 - 150, 240, 240); }
    ctx.globalAlpha = 1;
  }
  function drawTitle(now) {
    // Demo scene: a tilted wedge, the player tucked against the side facing away from a side attacker
    const demo = { shape: 'tri', cx: 230, cy: 320, hp: 4, hit: 0, pts: [[268, 282], [262, 366], [184, 306]] };
    drawCover(demo);
    ctx.fillStyle = C.player; ctx.beginPath(); ctx.arc(208, 350, PLAYER_R, 0, Math.PI * 2); ctx.fill();
    const a = 0.5 + 0.5 * Math.sin(now / 160);
    ctx.strokeStyle = `rgba(255,90,79,${0.35 + 0.5 * a})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(338, 326); ctx.lineTo(266, 326); ctx.stroke();
    ctx.fillStyle = C.enemy; ctx.beginPath(); ctx.moveTo(350, 312); ctx.lineTo(362, 326); ctx.lineTo(350, 340); ctx.lineTo(338, 326); ctx.fill();
    drawCover({ shape: 'flat', cx: 96, cy: 310, hp: 3, hit: 0, pts: [[54, 301], [138, 301], [138, 319], [54, 319]] });

    ctx.textAlign = 'center';
    ctx.fillStyle = C.player;
    ctx.font = `700 56px ${FONT}`;
    ctx.fillText('COVER', W / 2, 150);
    ctx.fillText('DASH', W / 2, 200);
    if (LOGO_WIDE.complete) { ctx.globalAlpha = 0.9; ctx.drawImage(LOGO_WIDE, W / 2 - 54, 30, 108, 36); ctx.globalAlpha = 1; }
    ctx.fillStyle = 'rgba(238,241,246,0.6)'; ctx.font = `600 13px ${FONT}`;
    const tl = `${best > 0 ? `BEST ${best}  ·  ` : ''}LV ${prog.level}  ·  ${prog.coins}`;
    ctx.fillText(tl, W / 2 - 6, 230); drawCoin(W / 2 - 6 + ctx.measureText(tl).width / 2 + 10, 226, 6);
    uiBtn(80, 392, 200, 50, 'PLAY', startPlay, 'primary');
    uiBtn(80, 450, 200, 44, 'PURE SKILL', () => { state = 'pure'; }, 'accent', `${pureLeft()} play token${pureLeft() === 1 ? '' : 's'} left today`);
    uiBtn(80, 502, 200, 36, 'LEADERBOARDS', () => { state = 'boards'; }, 'ghost');
    uiBtn(80, 546, 96, 36, 'SKINS', () => { state = 'skins'; }, 'ghost');
    uiBtn(184, 546, 96, 36, 'STORE', () => { state = 'store'; }, 'ghost');
    uiBtn(80, 590, 200, 36, 'SETTINGS', () => { state = 'settings'; }, 'ghost');
  }

  function drawHint() {
    ctx.font = `600 14px ${FONT}`;
    const y = 150;
    ctx.fillStyle = 'rgba(16,21,29,0.9)'; ctx.fillRect(28, y - 22, W - 56, 58);
    ctx.strokeStyle = C.player; ctx.lineWidth = 1.5; ctx.strokeRect(28.5, y - 21.5, W - 57, 57);
    ctx.fillStyle = C.ink; ctx.textAlign = 'center';
    const oneLine = ctx.measureText(hint.text).width <= W - 84;
    wrapText(hint.text, W / 2, oneLine ? y + 12 : y + 2, W - 84, 19);
  }

  function drawPause() {
    ctx.fillStyle = 'rgba(10,14,20,0.75)'; ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.textAlign = 'center'; ctx.fillStyle = C.player; ctx.font = `700 40px ${FONT}`;
    ctx.fillText('PAUSED', W / 2, 220);
    uiBtn(80, 270, 200, 50, 'RESUME', () => { state = 'play'; }, 'primary');
    uiBtn(80, 332, 200, 40, 'RESTART', startPlay, 'ghost');
    uiBtn(80, 384, 200, 40, 'MAIN MENU', toMenu, 'ghost');
    uiBtn(80, 450, 96, 36, settings.sfx ? 'SOUND ON' : 'SOUND OFF', () => { settings.sfx = !settings.sfx; saveSettings(); }, 'ghost');
    uiBtn(184, 450, 96, 36, settings.music ? 'MUSIC ON' : 'MUSIC OFF', () => { settings.music = !settings.music; saveSettings(); }, 'ghost');
  }

  function drawPure() {
    const left = pureLeft();
    ctx.textAlign = 'center'; ctx.fillStyle = '#5fe08a'; ctx.font = `700 34px ${FONT}`;
    ctx.fillText('PURE SKILL', W / 2, 110);
    ctx.fillStyle = 'rgba(238,241,246,0.75)'; ctx.font = `600 13px ${FONT}`;
    ctx.fillText('No items. No speed gates. No continues.', W / 2, 140);
    ctx.fillText('Just you and the cover, on its own leaderboard.', W / 2, 158);
    ctx.fillStyle = C.ink; ctx.font = `700 54px ${FONT}`; ctx.fillText(left, W / 2, 236);
    ctx.font = `600 13px ${FONT}`; ctx.fillStyle = 'rgba(238,241,246,0.6)';
    ctx.fillText(`PLAY TOKEN${left === 1 ? '' : 'S'} LEFT TODAY`, W / 2, 258);
    let y = 286;
    if (left > 0) uiBtn(60, y, W - 120, 50, 'START RUN', startPure, 'primary', 'Uses 1 play token');
    else { ctx.fillStyle = C.player; ctx.font = `700 14px ${FONT}`; ctx.fillText('Out of play tokens for today', W / 2, y + 30); }
    y += 62;
    if (!pure.ad) {
      uiBtn(60, y, W - 120, 44, noAds ? 'CLAIM +1 TOKEN' : 'WATCH AD FOR +1', () => {
        if (noAds) { pureDay(); pure.ad = 1; savePure(); toast = 'Got 1 Pure Skill play token'; toastT = 2; }
        else startAd('pure');
      }, 'ghost', noAds ? 'Free with Remove Ads · once a day' : 'Once a day');
      y += 52;

    ctx.font = `600 11px ${FONT}`; ctx.fillStyle = '#5b6575'; ctx.fillText('TEST MODE · NOTHING IS POSTED', 48, 218);
    ctx.fillStyle = '#e3e7ee'; ctx.fillRect(48, 232, W - 96, 92);
    ctx.fillStyle = '#141a24'; ctx.font = `600 15px ${FONT}`;
    wrapText(shareText(), 60, 258, W - 120, 20);
    uiBtn(48, 340, (W - 104) / 2, 42, '', () => { state = 'over'; }, 'ghost');
    ctx.fillStyle = '#141a24'; ctx.font = `700 14px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('CANCEL', 48 + (W - 104) / 4, 366);
    uiBtn(56 + (W - 104) / 2, 340, (W - 104) / 2, 42, 'SHARE', () => { state = 'over'; toast = 'Shared'; toastT = 1.5; }, 'primary');
  }

  // Stand-in for a real rewarded ad
  function drawAd() {
    ctx.fillStyle = '#0b0f15'; ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.strokeStyle = 'rgba(238,241,246,0.25)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 1.5;
    ctx.strokeRect(40, 170, W - 80, 260); ctx.setLineDash([]);
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(238,241,246,0.7)';
    ctx.font = `700 22px ${FONT}`; ctx.fillText('AD PLACEHOLDER', W / 2, 290);
    ctx.font = `600 13px ${FONT}`; ctx.fillText('A real rewarded ad will play here', W / 2, 316);
    ctx.fillStyle = C.player; ctx.font = `700 16px ${FONT}`;
    ctx.fillText(adPurpose === 'offer' ? `Your power-up arrives in ${Math.ceil(adLeft)}…` : adPurpose !== 'revive' ? `Your token arrives in ${Math.ceil(adLeft)}…` : `Back in the fight in ${Math.ceil(adLeft)}…`, W / 2, 470);
  }

  // ---------- Input ----------
  cvs.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (splashT > 0) { splashT = 0; return; }   // tap skips the studio splash
    const r = cvs.getBoundingClientRect();
    dash((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H + camY);
  });
  addEventListener('keydown', e => {
    audioInit();
    if (e.code === 'Escape' || e.code === 'KeyP') { if (state === 'play') state = 'paused'; else if (state === 'paused') state = 'play'; return; }
    if ((e.code === 'Enter' || e.code === 'Space') && (state === 'title' || (state === 'over' && !canRevive))) { e.preventDefault(); if (state === 'title') startPlay(); else replay(); return; }
    const map = { ArrowUp: [1, 0], Space: [1, 0], Enter: [1, 0], ArrowLeft: [1, -1], ArrowRight: [1, 1], ArrowDown: [-1, 0] };
    if (e.code in map) { e.preventDefault(); keyDash(...map[e.code]); }
    const digit = { Digit1: 'jam', Digit2: 'guard', Digit3: 'armor' }[e.code];
    if (digit) useStock(digit);
  });

  // Pause automatically when the app goes to the background
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'paused'; });

  // ---------- Loop ----------
  applyTheme(skin);
  reset();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  Ads.init(); Store.init();
  window.__game = { get tokens() { return tokens; }, get runs() { return runsPlayed; }, get state() { return state; }, get hint() { return hint; }, get skin() { return skin; }, get score() { return score; }, get flankers() { return flankers; }, get camY() { return camY; }, get pickups() { return pickups; }, get jam() { return jam; }, get guard() { return guard; }, get flankerAlive() { return flankers.length > 0; }, get player() { return player; }, get armor() { return armor; }, get rate() { return attackRate(); }, get inv() { return inv; }, get turrets() { return turrets; }, get best() { return [best, bestRate]; }, covers() { return liveCovers(camY, camY + H).map(c => ({ cx: c.cx, cy: c.cy, pts: c.pts, shape: c.shape, hp: c.hp })); }, path: findPath, get boardResult() { return boardResult; }, useStock, get pureLeft() { return pureLeft(); }, get mode() { return runMode; }, layout() { return rows.slice(0, 20).map(r => r.covers.map(c => c.shape + '@' + c.lane + ':' + c.pts[0].map(Math.round).join(',')).join('|')).join(' / '); }, rateAt(v) { const s0 = score; score = v; const r = attackRate(); score = s0; return r; }, kill() { if (state === "play") hitPlayer(); }, gates() { return rows.map(r => r.gate).filter(Boolean); }, get invFlash() { return invFlash; }, stockBlocked, markAhead() { const cs = liveCovers(camY, camY + H); for (const c of cs) { c.power = "jam"; c.hp = 1; } return cs.length; }, get prog() { return prog; }, get offerOpen() { return offerOpen; }, get adDay() { return adDay; }, get boost() { return [boostEnd, boostBlink]; }, forceGate() { const r = score + 1, row = rowAt(r), lane = [0, 1, 2].find(l => !row.covers.some(c => c.lane === l) && !rowAt(score).covers.some(c => c.lane === l)); if (lane === undefined) return null; row.gate = { x: LANES[lane], y: -r * GAP + 100, used: false, charged: false, chargeT: 0 }; return row.gate; } };
})();
